<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trekking Management Application (TMA) - V2</title>

    <!-- Bootstrap 5 CSS (Mandatory styling framework) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Vue 3 and Vue Router 4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue-router@4.3.0/dist/vue-router.global.prod.js"></script>
    <!-- Vue 3 SFC Loader CDN -->
    <script src="https://cdn.jsdelivr.net/npm/vue3-sfc-loader@0.8.4/dist/vue3-sfc-loader.js"></script>

    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main-content {
            flex: 1;
        }
        .hero-banner {
            background: linear-gradient(135deg, #198754 0%, #0d6efd 100%);
            color: white;
            padding: 2.5rem 1rem;
            border-radius: 0.5rem;
            margin-bottom: 2rem;
        }
        .badge-easy { background-color: #198754; color: white; }
        .badge-moderate { background-color: #fd7e14; color: white; }
        .badge-hard { background-color: #dc3545; color: white; }
        .footer-custom {
            background: #212529;
            color: #adb5bd;
            padding: 1.5rem 0;
            margin-top: 3rem;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Frontend Vue Application Bootstrap -->
    <script type="module" src="/frontend/src/app.js"></script>
</body>
</html>
